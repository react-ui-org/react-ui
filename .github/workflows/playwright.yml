name: Playwright

on:
  pull_request:
  schedule:
    - cron: '0 6 * * *' # daily at 6:00 UTC (7:00 CET, 8:00 CEST)

jobs:
  test:
    name: Playwright
    runs-on: ubuntu-24.04
    container:
      # Pinned by digest to match the `playwright` service, see `docker/playwright/Dockerfile`
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm

      - name: Print Node.js and npm version
        run: node --version && npm --version

      - name: Install
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests and generate test report
        run: npm run test:playwright-ct:all

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Upload Playwright test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
