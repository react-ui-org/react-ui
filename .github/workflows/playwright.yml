name: Playwright

on:
  pull_request:
  schedule:
    - cron: '0 6 * * *' # daily at 6:00 UTC (7:00 CET, 8:00 CEST)

# The Node.js version is the active LTS, the same version as in `.nvmrc`. Node.js and
# npm are pinned so that a broken npm release cannot break the build, see
# <https://github.com/nodejs/node/issues/62425#issuecomment-4200715930>.
env:
  NODE_VERSION: 26.13.1
  NPM_VERSION: 11.20.0

jobs:
  test:
    name: Playwright
    runs-on: ubuntu-24.04
    container:
      # Pinned by digest to match the `playwright` service, see `docker/playwright/Dockerfile`
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm@${{ env.NPM_VERSION }}
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Print Node.js and npm version
        run: node --version && npm --version

      - name: Install
        run: npm ci

      - name: Run Playwright tests and generate test report
        run: npm run test:playwright

      - name: Upload Playwright test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
