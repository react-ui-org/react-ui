name: Lint

on: [ pull_request ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.17
          cache: npm

      - name: Print Node.js and npm version
        run: node --version && npm --version

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run eslint

      - name: Markdownlint
        run: npm run markdownlint

      - name: Markdown link check (internal)
        run: npm run markdown-link-check:internal

      - name: Markdown link check (external)
        run: npm run markdown-link-check:external
        # Report broken links without blocking the pull request, external websites can fail at any time
        continue-on-error: true

      - name: Stylelint
        run: npm run stylelint

      - name: Typecheck
        run: npm run typecheck
